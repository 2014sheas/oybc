<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OYBC · Riso — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="proto/riso.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #C9C2B0;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(24,18,11,.08) 1px, transparent 0);
    background-size: 20px 20px;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: "Archivo", system-ui, sans-serif;
    padding: 28px;
    box-sizing: border-box;
  }
  #root { transform-origin: center center; }
  /* scale device down a touch so it fits typical viewports */
  @media (max-height: 920px) { #root { transform: scale(.86); } }
  @media (max-height: 800px) { #root { transform: scale(.76); } }
  @media (max-height: 700px) { #root { transform: scale(.66); } }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#2C44C9"/>
      <circle cx="40" cy="44" r="22" fill="#EB4D2E"/>
      <circle cx="60" cy="56" r="22" fill="#FBF6EA" stroke="#18120B" stroke-width="2"/>
    </svg>
  </template>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="proto/data.js"></script>
  <script type="text/babel" src="proto/ios-frame.jsx"></script>
  <script type="text/babel" src="proto/tweaks-panel.jsx"></script>
  <script type="text/babel" src="proto/components.jsx"></script>
  <script type="text/babel" src="proto/extras.jsx"></script>
  <script type="text/babel" src="proto/screens.jsx"></script>
  <script type="text/babel" src="proto/library.jsx"></script>
  <script type="text/babel" src="proto/taskstep.jsx"></script>
  <script type="text/babel" src="proto/profilepages.jsx"></script>
  <script type="text/babel" src="proto/tabs.jsx"></script>
  <script type="text/babel" src="proto/wizard.jsx"></script>
  <script type="text/babel" src="proto/app.jsx"></script>
</body>
</html>
