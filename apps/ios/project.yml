name: OYBC
options:
  bundleIdPrefix: com.oybc
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  SWIFT_VERSION: "5.9"
  ENABLE_PREVIEWS: YES

packages:
  # Swift Package Manager dependencies are NOT auto-updated by
  # Dependabot — the `swift` ecosystem isn't supported. Bump the
  # `from:` versions below by hand when:
  #   • A security advisory is published against one of these libs
  #   • A bug fix or API we want lands in a newer minor/patch
  # After bumping, run `xcodegen generate` and `xcodebuild` to
  # confirm the new version still resolves and builds.
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "6.24.0"
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
  # Snapshot tests for SwiftUI views — used only by OYBCSnapshotTests.
  # Render PNGs into __Snapshots__/ for autonomous CLI-driven UI
  # verification (no simulator boot, no manual screenshots).
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.18.0"
  # RevenueCat (StoreKit 2 / Purchases v5+). We use the core `RevenueCat`
  # product only — the Pro paywall is hand-built with the Riso kit, not
  # RevenueCatUI. appUserID is set to the Firebase uid at runtime.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

targets:
  OYBC:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: OYBC
        excludes:
          - "**/.DS_Store"
    resources:
      # Download from Firebase Console → Project Settings → iOS app → GoogleService-Info.plist
      # This file is gitignored — each developer must provide their own copy.
      # WARNING: `optional: true` is intentionally omitted, but that does NOT
      # make xcodegen fail when the plist is missing — verified: it exits 0 and
      # SILENTLY drops this reference from project.pbxproj. If that stripped
      # pbxproj is committed (e.g. from an agent worktree that lacked the plist
      # and regenerated the project), the app builds but CRASHES at launch:
      # "Could not locate configuration file: 'GoogleService-Info.plist'".
      # scripts/check-firebase-plist-ref.sh guards against this in CI (runs
      # before `xcodegen generate`) — run it locally before committing a pbxproj
      # change. If the ref is missing, `cp` the plist from another OYBC checkout
      # (or download it from the Firebase Console) and re-run `xcodegen generate`.
      - path: OYBC/GoogleService-Info.plist
      # Riso redesign — bundled display/body fonts (Bricolage Grotesque +
      # Archivo, static weights instanced from the OFL variable fonts).
      # Registered for use via UIAppFonts below. OFL.txt licenses ship alongside.
      - path: OYBC/Resources/Fonts
    dependencies:
      - package: GRDB
      - package: FirebaseSDK
        product: FirebaseAuth
      - package: FirebaseSDK
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: RevenueCat
        product: RevenueCat
    info:
      path: OYBC/Info.plist
      properties:
        GIDClientID: "401044947930-j31aflmqoltb2gm4luj6gt2l5opn0beb.apps.googleusercontent.com"
        # Required to save a shared board poster to Photos (add-only — the app
        # never reads the library). Without it, the first save call crashes.
        NSPhotoLibraryAddUsageDescription: "OYBC saves your board poster image to Photos."
        # TestFlight/App Store: the app uses only standard ATS/HTTPS (and
        # Firebase SDK) encryption — exempt from export documentation. This
        # key pre-answers the App Store Connect export-compliance question so
        # every upload skips the questionnaire.
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - BricolageGrotesque-Bold.ttf
          - BricolageGrotesque-ExtraBold.ttf
          - Archivo-Regular.ttf
          - Archivo-Medium.ttf
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
          - Archivo-ExtraBold.ttf
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.401044947930-j31aflmqoltb2gm4luj6gt2l5opn0beb"
    entitlements:
      path: OYBC/OYBC.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: OYBC/OYBC.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: "com.oybc.OYBC"
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        # DEVELOPMENT_TEAM comes from Signing.xcconfig (gitignored, per-developer)
    preBuildScripts:
      - script: |
          # Create database directory if it doesn't exist
          echo "Setting up app directories..."
        name: "Setup App Directories"
        basedOnDependencyAnalysis: false

  OYBCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OYBCTests
    resources:
      # Sync-contract cross-platform enforcement fixtures (workstream C4 /
      # issue #261). Canonical source of truth is
      # packages/shared/tests/fixtures/{syncContract,lwwVectors}.json —
      # xcodegen can't add resources from outside the project root
      # (apps/ios), so these are checked-in copies. Jest tests in
      # packages/shared/tests/ assert byte-for-byte equality against the
      # canonical files, so an un-synced copy fails `pnpm --filter
      # @oybc/shared test` — regenerate syncContract.json's copy via
      # `pnpm --filter @oybc/shared run gen:sync-contract` (writes both
      # locations); lwwVectors.json is hand-authored, copy both when
      # editing. See SyncContractTests.swift / LwwVectorTests.swift.
      - path: OYBCTests/Fixtures
    dependencies:
      - target: OYBC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.oybc.OYBCTests"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  # Snapshot tests for SwiftUI surfaces. Separate from OYBCTests so the
  # logic-test target stays light and we can run snapshots in isolation
  # via `xcodebuild test -only-testing:OYBCSnapshotTests`. PNG baselines
  # land in OYBCSnapshotTests/__Snapshots__/<TestClass>/<test>.png.
  OYBCSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OYBCSnapshotTests
        excludes:
          # swift-snapshot-testing locates baselines via #file (source-relative),
          # NOT the test bundle. Exclude the PNG trees from bundling to avoid
          # "Multiple commands produce" conflicts when two test classes share a
          # test function name (e.g. testNormalLight.1.png).
          - "**/__Snapshots__/**"
    dependencies:
      - target: OYBC
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.oybc.OYBCSnapshotTests"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OYBC:
    build:
      targets:
        OYBC: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OYBCTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  OYBCSnapshotTests:
    build:
      targets:
        OYBC: all
        OYBCSnapshotTests: all
    test:
      config: Debug
      targets:
        - OYBCSnapshotTests
