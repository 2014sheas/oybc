name: OYBC
options:
  bundleIdPrefix: com.oybc
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.0"
  
settings:
  base:
    DEVELOPMENT_TEAM: "" # Leave empty - will be set by Xcode automatically
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.oybc.app
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  OYBC:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OYBC
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oybc.app
        INFOPLIST_FILE: OYBC/Info.plist
        DEVELOPMENT_TEAM: "" # Xcode will prompt to select a team
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - package: GRDB
        product: GRDB
    preBuildScripts:
      - script: |
          # Add any pre-build scripts here if needed
        name: Pre-build
        basedOnDependencyAnalysis: false
        
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.24.0"
