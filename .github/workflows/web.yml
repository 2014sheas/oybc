name: Web

# Build, test, and lint the web app + shared package on every PR that
# touches them. Mirrors the iOS workflow's shape so contributors get
# consistent CI signal across the monorepo. Closes the gap that
# previously meant only iOS PRs got an automated check.

# No trigger-level `paths:` filter (2026-10 CI audit): the jobs below are
# REQUIRED status checks on `dev`, and a required check whose workflow never
# triggers sits at "Expected — waiting" forever, blocking docs-only PRs. The
# `changes` job decides instead; a job skipped by its `if:` reports success, so
# an unrelated PR passes the required checks in seconds.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# Cancel in-flight runs for the same PR when a newer commit is pushed.
# `github.ref` is a Git ref (sanitised by GitHub), safe to interpolate
# into the concurrency key — not user-controllable input.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN (2026-09 audit T1): every job only reads the
# repo. Widen per job, never here, and only where a step needs more.
permissions:
  contents: read

jobs:
  changes:
    # Path gate for the jobs below (see the `on:` comment). The filter list is
    # the old trigger-level `paths:` list, plus the iOS fixture copies:
    # packages/shared's fixtureSync.test.ts asserts they are byte-identical to
    # the canonical fixtures, and that test only runs here — an iOS-only edit
    # to a copy must still run it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'apps/coming-soon/**'
              - 'apps/ios/OYBCTests/Fixtures/**'
              - 'packages/**'
              - 'scripts/check-coming-soon-tokens.mjs'
              - 'scripts/check-knip.mjs'
              - 'scripts/audit/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - '.github/workflows/web.yml'

  build-test-lint:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        # v6 reads the pnpm version from `package.json#packageManager`
        # (pinned to 9.15.4 at the repo root) and ignores any `version:`
        # input here — so we omit it. To change the pnpm major used in
        # CI, bump the `packageManager` field, not this workflow.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20  # current LTS, satisfies engines: >=18
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # web: `tsc && tsc -p tsconfig.test.json && vite build` (app + test programs),
        # `tsc` for shared. No separate typecheck step needed.
        run: pnpm -w build

      - name: Test (bingo-core + riso-tokens)
        # Packages without a coverage gate run their plain `test` task. shared
        # and web are NOT here: their coverage runs below ARE their test runs
        # (2026-10 CI audit — each suite used to run twice, once plain and once
        # under coverage).
        run: pnpm turbo run test --filter=@oybc/bingo-core --filter=@oybc/riso-tokens

      - name: Test + coverage gate (shared)
        # Jest `coverageThreshold` in packages/shared/jest.config.js (80% global
        # on statements/branches/functions/lines; barrel index.ts files
        # excluded). A failing test OR a threshold miss fails this step; Jest's
        # output says which.
        run: pnpm --filter @oybc/shared test:coverage

      - name: Test + coverage floor (web)
        id: web-coverage
        # Vitest under v8 coverage. `coverage.thresholds` in
        # apps/web/vitest.config.ts is a FLOOR (the 2026-10-17 measurement,
        # rounded down) — raise it as coverage grows, never lower it to pass.
        # `text-summary` prints the totals here; `json-summary` uploads below.
        run: pnpm --filter @oybc/web test:coverage

      - name: Upload web coverage summary
        if: always() && steps.web-coverage.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage-summary
          path: apps/web/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Lint
        # ESLint on web + shared via Turbo's `lint` task.
        run: pnpm -w lint

      - name: Riso token drift-check
        # apps/coming-soon hand-copies packages/riso-tokens/riso.css's token
        # VALUES under unprefixed names (by design — zero build dependency).
        # Fails if the two ever diverge in value. See docs/COMING_SOON.md.
        run: node scripts/check-coming-soon-tokens.mjs

      - name: Dead-code drift-check (knip)
        # Fails on NEW unused web exports/types beyond the frozen baseline
        # (scripts/audit/knip-baseline.json) and on any unused file/dependency.
        # The mechanical half of the 2026-08 audit's dead-code findings.
        run: node scripts/check-knip.mjs

  e2e:
    # Playwright end-to-end suite (Chromium) — drives the real UI via the
    # dev-only auth bypass (apps/web/e2e/_fixtures/bypass.ts). Kept in a SEPARATE
    # job so the fast build/test/lint signal above isn't blocked on the browser
    # download + a full UI run. Shares the workflow-level `concurrency` group, so
    # a newer push cancels this too.
    #
    # Sharded across two runners (2026-10 CI audit: one serial worker took
    # ~8.5 min). Each shard keeps the exact single-worker, serial environment
    # the suite was stabilised on — its own dev server, its own browser — so
    # sharding cannot introduce cross-spec interference. `fail-fast: false` so
    # one red shard still reports the other's results.
    name: e2e (shard ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # `--with-deps` pulls the OS libraries Chromium needs on the runner.
        # Only Chromium is installed — the Playwright config's single project.
        run: pnpm --filter @oybc/web exec playwright install --with-deps chromium

      - name: Run Playwright e2e
        id: e2e
        # Blocking since 2026-10-08 (ROADMAP E7 closed by #556 / #557): `dev`'s
        # suite is green on CI (160 → 164 passing, 0 failing). A red run fails
        # the job — fix the flake or the regression; never re-add
        # `continue-on-error` to hide it (the 2026-09 advisory period let 10
        # broken specs merge green for weeks).
        # Vite aliases `@oybc/shared` + `@oybc/bingo-core` to their `src/`, so the
        # config's `webServer` (`pnpm dev`) needs no prior package build. CI mode
        # (`process.env.CI`) runs serial + retry-once + boots its own dev server.
        #
        # Dummy Firebase env: the runner has no `.env.local` (gitignored), and
        # without these the app throws at Firebase init before React mounts —
        # every spec then hangs to its timeout and the job dies on
        # `timeout-minutes` (the maiden run's failure mode). The auth-bypass
        # fixture never makes Firebase network calls, so garbage values are
        # safe and deterministic here.
        env:
          VITE_FIREBASE_API_KEY: e2e-dummy-key
          VITE_FIREBASE_AUTH_DOMAIN: e2e-dummy.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: e2e-dummy
          VITE_FIREBASE_STORAGE_BUCKET: e2e-dummy.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:e2edummy'
          VITE_FIREBASE_MEASUREMENT_ID: G-E2EDUMMY
        run: pnpm --filter @oybc/web test:e2e --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report on failure
        # Gated on the e2e step's own outcome so the report uploads on a red
        # run even though the step now fails the job (`failure()` alone would
        # also work; the step-scoped check keeps this independent of later
        # steps). Mirrors ios.yml's xcresult-on-failure artifact (7-day retention).
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7
