name: Web

# Build, test, and lint the web app + shared package on every PR that
# touches them. Mirrors the iOS workflow's shape so contributors get
# consistent CI signal across the monorepo. Closes the gap that
# previously meant only iOS PRs got an automated check.

on:
  pull_request:
    branches: [dev]
    paths:
      - 'apps/web/**'
      - 'apps/coming-soon/**'
      - 'packages/**'
      - 'scripts/check-coming-soon-tokens.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/web.yml'
  push:
    branches: [dev]
    paths:
      - 'apps/web/**'
      - 'apps/coming-soon/**'
      - 'packages/**'
      - 'scripts/check-coming-soon-tokens.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/web.yml'

# Cancel in-flight runs for the same PR when a newer commit is pushed.
# `github.ref` is a Git ref (sanitised by GitHub), safe to interpolate
# into the concurrency key — not user-controllable input.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        # v6 reads the pnpm version from `package.json#packageManager`
        # (pinned to 9.15.4 at the repo root) and ignores any `version:`
        # input here — so we omit it. To change the pnpm major used in
        # CI, bump the `packageManager` field, not this workflow.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20  # current LTS, satisfies engines: >=18
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # `tsc && vite build` for web (catches type errors via tsc),
        # `tsc` for shared. No separate typecheck step needed.
        run: pnpm -w build

      - name: Test
        # Turbo runs the `test` task in any package that defines one.
        # Today: shared (Jest, 297 tests). Web has no `test` script
        # and is silently skipped — that's the right behaviour.
        run: pnpm -w test

      - name: Lint
        # ESLint on web + shared via Turbo's `lint` task.
        run: pnpm -w lint

      - name: Riso token drift-check
        # apps/coming-soon hand-copies packages/riso-tokens/riso.css's token
        # VALUES under unprefixed names (by design — zero build dependency).
        # Fails if the two ever diverge in value. See docs/COMING_SOON.md.
        run: node scripts/check-coming-soon-tokens.mjs

  e2e:
    # Playwright end-to-end suite (Chromium) — drives the real UI via the
    # dev-only auth bypass (apps/web/e2e/_fixtures/bypass.ts). Kept in a SEPARATE
    # job so the fast build/test/lint signal above isn't blocked on the browser
    # download + a full UI run. Shares the workflow-level `concurrency` group, so
    # a newer push cancels this too.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # `--with-deps` pulls the OS libraries Chromium needs on the runner.
        # Only Chromium is installed — the Playwright config's single project.
        run: pnpm --filter @oybc/web exec playwright install --with-deps chromium

      - name: Run Playwright e2e
        id: e2e
        # Non-blocking for now (issue #309): the suite was just repaired, so we
        # let it soak for a few PRs of green history before it can fail a PR.
        # `continue-on-error` sits on THIS step (not the job) so a red run still
        # records `outcome == 'failure'` for the upload step below while keeping
        # the workflow green — the same graduation path the iOS snapshot suite
        # took. To flip it strict once stable: delete this `continue-on-error`.
        continue-on-error: true
        # Vite aliases `@oybc/shared` + `@oybc/bingo-core` to their `src/`, so the
        # config's `webServer` (`pnpm dev`) needs no prior package build. CI mode
        # (`process.env.CI`) runs serial + retry-once + boots its own dev server.
        run: pnpm --filter @oybc/web test:e2e

      - name: Upload Playwright report on failure
        # Gated on the e2e step's outcome (not job-level `failure()`) because the
        # step is `continue-on-error` — that keeps the job green, so `success()`
        # stays true here and the explicit outcome check is what fires the upload.
        # Mirrors ios.yml's xcresult-on-failure artifact (7-day retention).
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
