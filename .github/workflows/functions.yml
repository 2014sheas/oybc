name: Functions

# Build + emulator-test the Cloud Functions codebase (`functions/`) on every
# PR/push that touches it. Closes the CI gap proven by a recent
# functions-only PR that ran no checks at all — `functions/` was the repo's
# only server-side code with zero automated coverage.
#
# Also auto-deploys the codebase on push to dev (after tests pass) using the
# same FIREBASE_SERVICE_ACCOUNT secret as hosting.yml/firestore-rules.yml —
# the deliberately-added deploy workflow this header used to defer. A manual
# `workflow_dispatch` covers one-off redeploys. `--force` lets CI delete
# functions that were removed from source (continuous-delivery semantics).

on:
  pull_request:
    branches: [dev]
    paths:
      - 'functions/**'
      - 'packages/bingo-core/**'
      - 'firebase.json'
      - '.github/workflows/functions.yml'
  push:
    branches: [dev]
    paths:
      - 'functions/**'
      - 'packages/bingo-core/**'
      - 'firebase.json'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

# Cancel in-flight runs for the same PR (or the same push queue) when a
# newer commit lands. Scoped per-event (not just per-ref) so a `pull_request`
# run for a branch never cancels — or gets cancelled by — a `push` run for
# the same ref; the two events can be in flight at once (e.g. pushing
# directly to a branch that also has an open PR) and represent different
# checks that shouldn't race each other.
concurrency:
  group: functions-${{ github.event_name }}-${{ github.event.pull_request.number || 'push' }}
  # PR runs cancel superseded runs; push/dispatch runs NEVER cancel — a
  # workflow-level cancel kills every job in the prior run, including a
  # mid-flight `firebase deploy` in the deploy job below, which its own
  # job-level `cancel-in-progress: false` cannot protect against (review
  # finding on #396). Successive dev pushes queue instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        # v6 reads the pnpm version from `package.json#packageManager`
        # (pinned to 9.15.4 at the repo root) and ignores any `version:`
        # input here — so we omit it.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install workspace dependencies (pnpm)
        # Needed to build @oybc/bingo-core below — functions/'s "file:" devDep
        # on it (used by validateWin.ts, inlined into the esbuild bundle)
        # resolves to the workspace package's source tree either way, but the
        # bundle build needs its compiled dist/ to exist.
        run: pnpm install --frozen-lockfile

      - name: Build @oybc/bingo-core
        run: pnpm --filter @oybc/bingo-core build

      - name: Install functions dependencies (npm)
        working-directory: functions
        run: npm ci

      - name: Build functions
        # tsc --noEmit (type-check) + esbuild bundle to lib/index.js. The
        # Functions emulator loads the BUILT lib/index.js, not src/, so this
        # must run before the emulator step below — it's not implicitly
        # triggered by `emulators:exec` (predeploy hooks in firebase.json
        # only fire for `firebase deploy`, not for `emulators:start`/`:exec`).
        working-directory: functions
        run: npm run build

      - name: Setup Java (required by the Firestore emulator)
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install firebase-tools
        # PINNED (2026-07-30): firebase-tools@latest hard-fails emulator
        # function discovery on unauthenticated demo-* projects when the
        # codebase declares a defineSecret ("Unable to refresh auth: not yet
        # authenticated" → zero functions load → every HTTP test fails).
        # 15.13.0 degrades gracefully (warns, loads, suite green) — verified
        # by reproducing both behaviors locally with XDG_CONFIG_HOME pointed
        # at an empty dir. Bump deliberately: re-test unauthenticated first.
        run: npm install -g firebase-tools@15.13.0

      - name: Run emulator-backed tests
        # Must run from the REPO ROOT: `firebase.json` (the emulator/project
        # config) lives there, and firebase-tools rejects being pointed at a
        # config path that escapes the invoking directory. The wrapped
        # command runs vitest inside functions/ via --prefix so its
        # package.json scripts and node_modules resolve correctly while the
        # firebase CLI itself still resolves firebase.json at the root.
        env:
          # Test-only value for the RevenueCat webhook auth secret. The webhook
          # reads REVENUECAT_WEBHOOK_AUTH via defineSecret in prod; in the
          # emulator it falls back to process.env, so both the emulated function
          # and the test process (children of emulators:exec) see this value and
          # agree on the valid-auth path. NOT the production secret.
          REVENUECAT_WEBHOOK_AUTH: test-rc-webhook-secret
        run: |
          firebase emulators:exec \
            --only functions,firestore \
            --project demo-oybc-functions-test \
            "npm --prefix functions run test:run"

  deploy:
    # Push-to-dev (or manual) only — PR runs stop at build-and-test. Gated on
    # the tests so a red suite never ships.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize function deploys; never kill one mid-flight (same rationale
    # as hosting.yml's deploy concurrency).
    concurrency:
      group: functions-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install workspace dependencies (pnpm)
        # @oybc/bingo-core must be built for the esbuild bundle (validateWin).
        run: pnpm install --frozen-lockfile

      - name: Build @oybc/bingo-core
        run: pnpm --filter @oybc/bingo-core build

      - name: Install functions dependencies (npm)
        working-directory: functions
        run: npm ci

      - name: Install firebase-tools
        # Same pin + rationale as the test job above.
        run: npm install -g firebase-tools@15.13.0

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT: oybc-dev-e2668
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is not set."
            exit 1
          fi
          printf '%s' "$FIREBASE_SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy \
            --only functions \
            --project "$FIREBASE_PROJECT" \
            --non-interactive \
            --force
