name: iOS

# Logic tests, snapshot tests and a Release build of the OYBC app, as three
# PARALLEL macOS jobs (2026-10 CI audit — they used to run back to back in one
# ~24-min job, half of it the snapshot step). Wall clock is now the slowest of
# the three instead of their sum.
#
# No trigger-level `paths:` filter: these jobs sit behind the REQUIRED `ios-ok`
# check on `dev`, and a required check whose workflow never triggers blocks the PR
# forever. The `changes` job gates them instead; a job skipped by its `if:`
# reports success. `packages/shared/**` is deliberately NOT a trigger any more
# — no iOS build input lives there (the cross-platform fixtures are checked-in
# copies under apps/ios/OYBCTests/Fixtures, which ARE under apps/ios).

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN (2026-09 audit T1). Widen per job, never here.
permissions:
  contents: read

env:
  # Pinned to Xcode 26.3 so snapshot baselines recorded on a local 26.3
  # toolchain match what CI renders as closely as the runner's simulators
  # allow. The macos-15 default (16.4) is too old for the iOS 26.x simulator.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  # Pinned XcodeGen release (installed by .github/actions/ios-setup). To bump:
  # pick a tag from https://github.com/yonaskolb/XcodeGen/releases, download
  # its `xcodegen.zip`, `shasum -a 256` it, and update both vars.
  XCODEGEN_VERSION: "2.45.4"
  XCODEGEN_ZIP_SHA256: "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef"
  # Repo-relative derived data so the SPM checkout under it is cacheable.
  # Covered by apps/ios/.gitignore's bare `DerivedData` pattern.
  DERIVED_DATA_PATH: ${{ github.workspace }}/apps/ios/DerivedData

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'apps/ios/**'
              - '.github/workflows/ios.yml'
              - '.github/actions/ios-setup/**'
              - '.github/actions/ios-sim-boot/**'
              - 'scripts/audit/check-snapshot-reds.mjs'
              - 'scripts/audit/snapshot-ci-known-reds.json'

  logic-tests:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-setup
      - uses: ./.github/actions/ios-sim-boot

      - name: Build for testing
        # Separate from the test run so the simulator keeps booting while this
        # compiles. Raw xcodebuild output (no xcpretty) so crash logs and Swift
        # fatal-error traces stay visible.
        working-directory: apps/ios
        run: |
          xcodebuild build-for-testing \
            -scheme OYBC \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run logic tests
        working-directory: apps/ios
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcodebuild test-without-building \
            -scheme OYBC \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  snapshot-tests:
    # BLOCKING on NEW reds only. CI's runner has iOS 26.2 simulators while
    # baselines are recorded on 26.3.1, and a fixed set of grid views lays out
    # differently there (a real layout shift, not anti-aliasing — no tolerance
    # absorbs it). scripts/audit/snapshot-ci-known-reds.json freezes that set;
    # check-snapshot-reds.mjs fails on any red outside it, on a run that never
    # finished, or on a log it can't fully account for. Shrink the list as
    # reds are fixed; when the runner ships iOS 26.3 it should go empty.
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-setup
      - uses: ./.github/actions/ios-sim-boot

      - name: Build for testing
        working-directory: apps/ios
        run: |
          xcodebuild build-for-testing \
            -scheme OYBCSnapshotTests \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run snapshot tests
        working-directory: apps/ios
        env:
          # Fail-on-missing in CI: tests use `record: .missing` locally, which
          # would silently record an ephemeral baseline here and pass. The
          # library honours this env var ahead of any per-call setting.
          SNAPSHOT_TESTING_RECORD: never
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          # xcodebuild's exit status is expected to be non-zero while known
          # reds exist; the gate step below decides pass/fail from the log.
          set +e
          xcodebuild test-without-building \
            -scheme OYBCSnapshotTests \
            -destination "id=$SIM_UDID" \
            -resultBundlePath "$RUNNER_TEMP/snapshot-results.xcresult" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/snapshot.log"
          echo "xcodebuild exit: ${PIPESTATUS[0]}"

      - name: Snapshot gate (new reds only)
        id: gate
        run: |
          node scripts/audit/check-snapshot-reds.mjs --self-test
          node scripts/audit/check-snapshot-reds.mjs "$RUNNER_TEMP/snapshot.log"

      - name: Upload snapshot test results on failure
        # Only when the gate fails — the known reds would otherwise upload a
        # ~95 MB bundle on every run. Pull it to compare reference / failure /
        # difference PNGs without re-running.
        if: failure() && steps.gate.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-test-results
          path: ${{ runner.temp }}/snapshot-results.xcresult
          retention-days: 7
          if-no-files-found: warn

  release-build:
    # Compiles the Release configuration for device, the way Xcode Cloud's
    # archive does (2026-10 CI audit). The test jobs only build Debug, so
    # code that compiles only under `#if DEBUG` (or breaks under Release
    # optimisation) used to surface after merge, in the TestFlight build.
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-setup

      - name: Build Release (generic iOS device, unsigned)
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -scheme OYBC \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  ios-ok:
    # THE required status check for this workflow (2026-10-17). Requiring the
    # real jobs directly fails in two ways: a matrix job skipped by its `if:`
    # never expands, so its "(shard 1/2)" names never report and a required
    # check waits forever; and if `changes` itself errors, every gated job is
    # skipped and "skipped" counts as passing. This job always runs, fails
    # unless `changes` succeeded, and fails unless every gated job passed or
    # was skipped by the path gate.
    needs: [changes, logic-tests, snapshot-tests, release-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: >-
            logic-tests=${{ needs.logic-tests.result }}
            snapshot-tests=${{ needs.snapshot-tests.result }}
            release-build=${{ needs.release-build.result }}
        run: |
          set -u
          if [ "$CHANGES" != success ]; then
            echo "::error::changes job: $CHANGES — the path gate did not run, so nothing was tested"
            exit 1
          fi
          fail=0
          for pair in $RESULTS; do
            job=${pair%%=*}; result=${pair#*=}
            echo "$job: $result"
            case "$result" in success|skipped) ;; *) echo "::error::$job: $result"; fail=1 ;; esac
          done
          exit $fail
