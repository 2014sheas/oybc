# Dependabot keeps npm + GitHub Actions dependencies fresh. Each PR
# Dependabot opens still goes through the web / iOS CI for verification,
# so no automerge is configured — major version bumps stay reviewable.
#
# Swift Package Manager is intentionally NOT listed: GitHub Dependabot
# doesn't support `swift` as an ecosystem. iOS dependencies (Firebase,
# GRDB, GoogleSignIn) are pinned in `apps/ios/project.yml` and bumped
# manually for now.

version: 2

updates:
  # npm — root + workspaces. Dependabot follows pnpm-workspace.yaml
  # automatically when ecosystem is npm and directory is the workspace
  # root, so no per-package entries needed.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the new native (Go) compiler. `tsc` itself works with
      # minor tsconfig fixes, but the surrounding TS tooling doesn't support it
      # yet: @typescript-eslint crashes on `pnpm lint` and ts-jest can't run the
      # shared/bingo-core unit suites. Ignore major bumps until the ecosystem
      # catches up, then adopt deliberately. See closed PR #324.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Group all minor + patch updates into one PR per ecosystem per
      # week so Monday morning isn't a flood of single-line bumps.
      # Major updates still get individual PRs because they're more
      # likely to need scrutiny / migration notes.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # npm — Cloud Functions (`functions/`). Not covered by the root npm entry
  # above: `functions/` has its own `package-lock.json` (npm, not pnpm —
  # Cloud Functions deploy tooling expects an npm-managed function source
  # dir) and isn't a pnpm workspace member, so Dependabot needs an explicit
  # directory entry to see it.
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions versions (the `uses:` lines in our workflow files).
  # Lower cadence — Actions ecosystem moves slowly and security
  # advisories are rare.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(actions)"
