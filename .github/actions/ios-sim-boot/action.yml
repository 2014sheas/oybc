name: Boot iOS simulator
description: >
  Starts booting an iPhone 16 on the newest installed iOS runtime and exports
  its UDID as SIM_UDID. `simctl boot` blocks until the device is up (2–3 min
  on the runner), so it runs in the BACKGROUND and the boot overlaps the next
  step's build (2026-10 CI audit: each test step sat silent for 3.5–7.5 min
  before its first test; a foreground boot only moved that time earlier).
  The runner reaps the background process at job end, not step end. Call `xcrun simctl bootstatus "$SIM_UDID" -b` before testing
  to wait for it, and pass `-destination "id=$SIM_UDID"` to xcodebuild.
  "Newest installed runtime" matches the old `OS=latest` destination, which
  the Xcode pin makes deterministic on the runner.

runs:
  using: composite
  steps:
    - name: Boot simulator
      shell: bash
      run: |
        set -euo pipefail
        UDID=$(xcrun simctl list devices available -j | python3 -c '
        import json, re, sys
        devs = json.load(sys.stdin)["devices"]
        def ver(k):
            m = re.search(r"iOS-(\d+)-(\d+)(?:-(\d+))?$", k)
            return tuple(int(x or 0) for x in m.groups()) if m else None
        runtimes = sorted((k for k in devs if ver(k)), key=ver, reverse=True)
        for rt in runtimes:
            for d in devs[rt]:
                if d["name"] == "iPhone 16":
                    print(d["udid"]); sys.exit(0)
        sys.exit("no available iPhone 16 simulator")
        ')
        echo "Booting iPhone 16 $UDID"
        # Background + detached; already-booted is fine. bootstatus -b waits.
        nohup xcrun simctl boot "$UDID" > "$RUNNER_TEMP/sim-boot.log" 2>&1 &
        echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
